          - {"language":"Go","project":"Prometheus","repository":"prometheus/prometheus","ref":"0a41f0000705c69ab8e0f9a723fc73e39ed62b07","tool":"1.27.4","command":"go build -trimpath -o bin/prometheus ./cmd/prometheus","verify":"bin/prometheus --version","provider":"Monk CI","runner":"monkci-ubuntu-24.04-32","slug":"monkci"}
