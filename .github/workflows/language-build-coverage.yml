name: Language Build Coverage - Monk CI vs Blacksmith
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  benchmark:
    name: ${{ matrix.language }} / ${{ matrix.project }} / ${{ matrix.provider }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {"language":"Java/JVM","project":"Kafka","repository":"apache/kafka","ref":"1bcb23135e142d448081dfdb6b6b1ecc505e08b9","tool":"21.0.13+9.0.LTS","command":"./gradlew --no-build-cache --console=plain build -x test","verify":"find core/build/libs -name 'kafka_*.jar' -type f | grep .","provider":"Monk CI","runner":"monkci-ubuntu-24.04-32","slug":"monkci"}
          - {"language":"Java/JVM","project":"Kafka","repository":"apache/kafka","ref":"1bcb23135e142d448081dfdb6b6b1ecc505e08b9","tool":"21.0.13+9.0.LTS","command":"./gradlew --no-build-cache --console=plain build -x test","verify":"find core/build/libs -name 'kafka_*.jar' -type f | grep .","provider":"Blacksmith","runner":"blacksmith-32vcpu-ubuntu-2404","slug":"blacksmith"}
