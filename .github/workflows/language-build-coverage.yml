          - {"language":"Node/TypeScript","project":"Prettier","repository":"prettier/prettier","ref":"7a8b05f41574633fd3af5298f3eeaf33567ad3d3","tool":"yarn","command":"yarn install --immutable && yarn run build","verify":"node dist/prettier/bin/prettier.cjs --version","provider":"Blacksmith","runner":"blacksmith-32vcpu-ubuntu-2404","slug":"blacksmith"}
    defaults:
      run:
        shell: bash
    env:
      BUILD_COMMAND: ${{ matrix.command }}
      VERIFY_COMMAND: ${{ matrix.verify }}
      PROJECT: ${{ matrix.project }}
      LANGUAGE: ${{ matrix.language }}
      TOOL: ${{ matrix.tool }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      RUSTC_WRAPPER: ''
      RUSTC_WORKSPACE_WRAPPER: ''
    steps:
      - name: Record hardware
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          { date -u; nproc; lscpu; free -b; df -h; cat /etc/os-release; } > "$RUNNER_TEMP/results/hardware.txt"
          test "$(nproc)" -eq 32
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          persist-credentials: false
          # bat ships compiled syntax/theme assets; its obsolete syntax submodules are not needed to build.
          submodules: ${{ matrix.project == 'bat' && 'false' || 'recursive' }}
      - name: Configure isolated dependency directories
        run: |
          {
            echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle"
            echo "npm_config_cache=$RUNNER_TEMP/npm-cache"
            echo "YARN_GLOBAL_FOLDER=$RUNNER_TEMP/yarn-global"
            echo "GOCACHE=$RUNNER_TEMP/go-build"
            echo "GOMODCACHE=$RUNNER_TEMP/go-mod"
            echo "GOTOOLCHAIN=local"
            echo "MAVEN_OPTS=-Xmx8g -XX:ActiveProcessorCount=32"
          } >> "$GITHUB_ENV"
          { echo "Workflow $GITHUB_SHA"; git rev-parse HEAD; printf '%s\n' "$BUILD_COMMAND"; } > "$RUNNER_TEMP/results/source.txt"
      - uses: actions/setup-java@v4
        if: matrix.language == 'Java/JVM'
        with:
          distribution: temurin
          java-version: ${{ matrix.tool }}
      - uses: dtolnay/rust-toolchain@1.95.0
        if: matrix.language == 'Rust'
      - uses: actions/setup-go@v5
        if: matrix.language == 'Go'
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-node@v4
        if: matrix.language == 'Node/TypeScript'
        with:
          node-version: '22.14.0'
      - name: Install native build tools
        if: matrix.language == 'Rust' || matrix.project == 'BookKeeper'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev cmake
      - name: Install Maven
        if: matrix.project == 'BookKeeper' || matrix.project == 'Artemis'
        run: |
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz -o "$RUNNER_TEMP/maven.tar.gz"
          echo "a555254d6b53d267965a3404ecb14e53c3827c09c3b94b5678835887ab404556bfaf78dcfe03ba76fa2508649dca8531c74bca4d5846513522404d48e8c4ac8b  $RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
      - name: Install Zed dependencies
        if: matrix.project == 'Zed'
        run: ./script/linux
      - name: Isolate Rust dependencies
        if: matrix.language == 'Rust'
        run: echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
      - name: Install package manager
        if: matrix.language == 'Node/TypeScript'
        run: |
          case "$TOOL" in
            npm) ;;
            yarn)
              mkdir -p "$RUNNER_TEMP/package-manager-bin"
              printf '#!/usr/bin/env bash\nexec node "%s/.yarn/releases/yarn-4.9.2.cjs" "$@"\n' "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/package-manager-bin/yarn"
              chmod +x "$RUNNER_TEMP/package-manager-bin/yarn"
              echo "$RUNNER_TEMP/package-manager-bin" >> "$GITHUB_PATH"
              ;;
            *) npm install --global "pnpm@$TOOL" ;;
          esac
      - name: Pin Traefik WebUI base image
        if: matrix.project == 'Traefik'
        run: |
          sed -i 's|^FROM node:26-alpine3.24$|FROM node:26-alpine3.24@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5|' webui/buildx.Dockerfile
          grep -F 'sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5' webui/buildx.Dockerfile
          git diff > "$RUNNER_TEMP/results/source-patch.diff"
      - name: Record toolchain
        run: |
          case "$LANGUAGE" in
            Java/JVM) { java -version; javac -version; } ;;
            Rust) cargo +1.95.0 --version; rustc +1.95.0 --version ;;
            Go) go version ;;
            Node/TypeScript) node --version; npm --version ;;
          esac > "$RUNNER_TEMP/results/toolchain.txt" 2>&1
      - name: Measure workload
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/results/build-time.txt" bash -e -o pipefail -c "$BUILD_COMMAND" 2>&1 | tee "$RUNNER_TEMP/results/build.log"
      - name: Verify output
        run: bash -e -o pipefail -c "$VERIFY_COMMAND"
      - name: Publish measurements
        if: always()
        env:
          PROVIDER: ${{ matrix.provider }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "## $PROJECT / $PROVIDER"
            echo "Outcome: $OUTCOME"
            echo 'One attempt per provider. Primary comparison uses job start to completion, including setup and cleanup, excluding queue.'
            echo 'Supplementary build timing includes dependency downloads but excludes setup.'
            cat "$RUNNER_TEMP/results/build-time.txt" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurements-${{ matrix.project }}-${{ matrix.slug }}
          path: ${{ runner.temp }}/results/
          retention-days: 30
