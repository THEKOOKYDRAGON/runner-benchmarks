name: TypeScript Build - Monk CI vs Blacksmith
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  benchmark:
    name: ${{ matrix.provider }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: Monk CI
            runner: monkci-ubuntu-24.04-32
            artifact: monkci
          - provider: Blacksmith
            runner: blacksmith-32vcpu-ubuntu-2404
            artifact: blacksmith
    defaults:
      run:
        shell: bash
    steps:
      - name: Record hardware
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          { date -u; nproc; lscpu; free -b; df -h; cat /etc/os-release; } > "$RUNNER_TEMP/results/hardware.txt"
          test "$(nproc)" -eq 32
      - uses: actions/checkout@v4
        with:
          repository: microsoft/TypeScript
          ref: c63de15a992d37f0d6cec03ac7631872838602cb
          persist-credentials: false
      - name: Record source
        run: |
          { echo "Workflow $GITHUB_SHA"; git rev-parse HEAD; } > "$RUNNER_TEMP/results/source.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Configure Node build
        run: |
          echo "npm_config_cache=$RUNNER_TEMP/isolated-npm" >> "$GITHUB_ENV"
          { node --version; npm --version; } > "$RUNNER_TEMP/results/toolchain.txt"
      - name: Measure workload
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/results/build-time.txt" bash -e -o pipefail -c 'npm ci --no-audit --no-fund && npm run build' 2>&1 | tee "$RUNNER_TEMP/results/build.log"
      - name: Verify output
        run: |
          node built/local/tsc.js --version
      - name: Publish measurements
        if: always()
        env:
          PROVIDER: ${{ matrix.provider }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "## TypeScript Build / $PROVIDER"
            echo "Outcome: $OUTCOME"
            echo 'One sample. Dependency downloads included; queue and setup excluded from workload timing.'
            echo '\`\`\`text'
            cat "$RUNNER_TEMP/results/build-time.txt" 2>/dev/null || true
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurements-${{ matrix.artifact }}
          path: ${{ runner.temp }}/results/
          retention-days: 30
