          - {"language":"Go","project":"Hugo","repository":"gohugoio/hugo","ref":"6abdacad3f3fe944ea42177844469139e81feda6","tool":"1.27.4","command":"go build -trimpath -o bin/hugo .","verify":"bin/hugo version","provider":"Blacksmith","runner":"blacksmith-32vcpu-ubuntu-2404","slug":"blacksmith"}
