name: Artemis Build and CI Tests - Monk CI vs Blacksmith
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  benchmark:
    name: ${{ matrix.provider }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: Monk CI
            runner: monkci-ubuntu-24.04-32
            artifact: monkci
          - provider: Blacksmith
            runner: blacksmith-32vcpu-ubuntu-2404
            artifact: blacksmith
    defaults:
      run:
        shell: bash
    steps:
      - name: Record hardware
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          { date -u; nproc; lscpu; free -b; df -h; cat /etc/os-release; } > "$RUNNER_TEMP/results/hardware.txt"
          test "$(nproc)" -eq 32
      - uses: actions/checkout@v4
        with:
          repository: apache/artemis
          ref: 2c3903ff71de7ecc6830d5f051dfc94d6df9b187
          persist-credentials: false
      - name: Record source
        run: |
          { echo "Workflow $GITHUB_SHA"; git rev-parse HEAD; } > "$RUNNER_TEMP/results/source.txt"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz -o "$RUNNER_TEMP/maven.tar.gz"
          echo "a555254d6b53d267965a3404ecb14e53c3827c09c3b94b5678835887ab404556bfaf78dcfe03ba76fa2508649dca8531c74bca4d5846513522404d48e8c4ac8b  $RUNNER_TEMP/maven.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          echo 'MAVEN_OPTS=-Xmx8g -XX:ActiveProcessorCount=32' >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/isolated-m2"
      - name: Record toolchain
        run: |
          { java -version; javac -version; mvn --version; gcc --version; } > "$RUNNER_TEMP/results/toolchain.txt" 2>&1
      - name: Measure workload
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/results/build-time.txt" timeout --signal=TERM --kill-after=30s 40m bash -e -o pipefail -c 'mvn -B -ntp -s .github/maven-settings.xml -Dmaven.repo.local="$RUNNER_TEMP/isolated-m2" -Dorg.apache.activemq.artemis.core.io.aio.AIOSequentialFileFactory.DISABLED=AnythingNotNull -Pfast-tests -Pcompatibility-tests -Dsurefire.rerunFailingTestsCount=0 -Dfailsafe.rerunFailingTestsCount=0 clean install' 2>&1 | tee "$RUNNER_TEMP/results/build.log"
      - name: Verify tests executed
        run: |
          test -d "tests/unit-tests/target/surefire-reports"
          test -n "$(find "tests/unit-tests/target/surefire-reports" -name 'TEST-*.xml' -print -quit)"
      - name: Collect test reports
        if: always()
        run: |
          find . -type f \( -path '*/surefire-reports/TEST-*.xml' -o -path '*/failsafe-reports/TEST-*.xml' \) -print0 > "$RUNNER_TEMP/test-report-files"
          if test -s "$RUNNER_TEMP/test-report-files"; then
            tar --null -T "$RUNNER_TEMP/test-report-files" -czf "$RUNNER_TEMP/results/test-reports.tar.gz"
            xargs -0 grep -h -m 1 '<testsuite ' < "$RUNNER_TEMP/test-report-files" > "$RUNNER_TEMP/results/test-suites.txt"
          fi
      - name: Publish measurements
        if: always()
        env:
          PROVIDER: ${{ matrix.provider }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "## Artemis Build and CI Tests / $PROVIDER"
            echo "Outcome: $OUTCOME"
            echo 'One workflow attempt per provider, automatic test retries disabled. Sheet measures job pickup to completion, including setup and cleanup, excluding queue. Build/test timer is supplementary.'
            echo '```text'
            cat "$RUNNER_TEMP/results/build-time.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurements-${{ matrix.artifact }}
          path: ${{ runner.temp }}/results/
          retention-days: 30
