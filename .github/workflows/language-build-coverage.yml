          - {"language":"Java/JVM","project":"Lucene","repository":"apache/lucene","ref":"51190f35a16d2ce433139abfe0fd8365791b352a","tool":"21.0.13+9.0.LTS","command":"./gradlew --no-build-cache --console=plain assemble","verify":"find lucene/core/build -name 'lucene-core-*.jar' -type f | grep .","provider":"Monk CI","runner":"monkci-ubuntu-24.04-32","slug":"monkci"}
