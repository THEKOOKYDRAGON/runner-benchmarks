          - {"language":"Rust","project":"bat","repository":"sharkdp/bat","ref":"25f4f96ea3afb6fe44552f3b38ed8b1540ffa1b3","tool":"1.95.0","command":"cargo +1.95.0 build --release --locked --bin bat","verify":"target/release/bat --version","provider":"Monk CI","runner":"monkci-ubuntu-24.04-32","slug":"monkci"}
