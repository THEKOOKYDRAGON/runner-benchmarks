          - {"language":"Go","project":"Traefik","repository":"traefik/traefik","ref":"36b2bd1bd4538dec67b2e7ca6eb395eae47396ee","tool":"1.27.4","command":"make binary","verify":"dist/linux/amd64/traefik version","provider":"Monk CI","runner":"monkci-ubuntu-24.04-32","slug":"monkci"}
          - {"language":"Go","project":"Traefik","repository":"traefik/traefik","ref":"36b2bd1bd4538dec67b2e7ca6eb395eae47396ee","tool":"1.27.4","command":"make binary","verify":"dist/linux/amd64/traefik version","provider":"Blacksmith","runner":"blacksmith-32vcpu-ubuntu-2404","slug":"blacksmith"}
          - {"language":"Node/TypeScript","project":"TypeScript","repository":"microsoft/TypeScript","ref":"c63de15a992d37f0d6cec03ac7631872838602cb","tool":"npm","command":"npm ci --no-audit --no-fund && npm run build","verify":"node built/local/tsc.js --version","provider":"Monk CI","runner":"monkci-ubuntu-24.04-32","slug":"monkci"}
          - {"language":"Node/TypeScript","project":"TypeScript","repository":"microsoft/TypeScript","ref":"c63de15a992d37f0d6cec03ac7631872838602cb","tool":"npm","command":"npm ci --no-audit --no-fund && npm run build","verify":"node built/local/tsc.js --version","provider":"Blacksmith","runner":"blacksmith-32vcpu-ubuntu-2404","slug":"blacksmith"}
          - {"language":"Node/TypeScript","project":"Vite","repository":"vitejs/vite","ref":"2436afef044d90f710fdfd714488a71efdd29092","tool":"10.18.3","command":"pnpm install --frozen-lockfile --store-dir \"$RUNNER_TEMP/pnpm-store\" && pnpm run build","verify":"node packages/vite/bin/vite.js --version","provider":"Monk CI","runner":"monkci-ubuntu-24.04-32","slug":"monkci"}
          - {"language":"Node/TypeScript","project":"Vite","repository":"vitejs/vite","ref":"2436afef044d90f710fdfd714488a71efdd29092","tool":"10.18.3","command":"pnpm install --frozen-lockfile --store-dir \"$RUNNER_TEMP/pnpm-store\" && pnpm run build","verify":"node packages/vite/bin/vite.js --version","provider":"Blacksmith","runner":"blacksmith-32vcpu-ubuntu-2404","slug":"blacksmith"}
          - {"language":"Node/TypeScript","project":"Svelte","repository":"sveltejs/svelte","ref":"b92a55994b7349e5c681df97a571481488020bc4","tool":"10.4.0","command":"pnpm install --frozen-lockfile --store-dir \"$RUNNER_TEMP/pnpm-store\" && pnpm run build","verify":"test -s packages/svelte/compiler/index.js","provider":"Monk CI","runner":"monkci-ubuntu-24.04-32","slug":"monkci"}
          - {"language":"Node/TypeScript","project":"Svelte","repository":"sveltejs/svelte","ref":"b92a55994b7349e5c681df97a571481488020bc4","tool":"10.4.0","command":"pnpm install --frozen-lockfile --store-dir \"$RUNNER_TEMP/pnpm-store\" && pnpm run build","verify":"test -s packages/svelte/compiler/index.js","provider":"Blacksmith","runner":"blacksmith-32vcpu-ubuntu-2404","slug":"blacksmith"}
