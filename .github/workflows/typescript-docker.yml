name: TypeScript Docker Build - Monk CI vs Blacksmith
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  benchmark:
    name: ${{ matrix.provider }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: Monk CI
            runner: monkci-ubuntu-24.04-32
            artifact: monkci
          - provider: Blacksmith
            runner: blacksmith-32vcpu-ubuntu-2404
            artifact: blacksmith
    defaults:
      run:
        shell: bash
    steps:
      - name: Record hardware
        run: |
          mkdir -p "$RUNNER_TEMP/results"
          { date -u; nproc; lscpu; free -b; df -h; cat /etc/os-release; } > "$RUNNER_TEMP/results/hardware.txt"
          test "$(nproc)" -eq 32
      - uses: actions/checkout@v4
        with:
          repository: microsoft/TypeScript
          ref: c63de15a992d37f0d6cec03ac7631872838602cb
          persist-credentials: false
      - name: Record source
        run: |
          { echo "Workflow $GITHUB_SHA"; git rev-parse HEAD; } > "$RUNNER_TEMP/results/source.txt"
      - name: Prepare Docker build
        run: |
          docker version > "$RUNNER_TEMP/results/toolchain.txt"
          cat > "$RUNNER_TEMP/Benchmark.Dockerfile" <<'DOCKERFILE'
          FROM node:22.14.0-bookworm-slim@sha256:1c18d9ab3af4585870b92e4dbc5cac5a0dc77dd13df1a5905cea89fc720eb05b AS build
          WORKDIR /src
          COPY package.json package-lock.json ./
          RUN npm ci --no-audit --no-fund
          COPY . .
          RUN npm run build
          FROM node:22.14.0-bookworm-slim@sha256:1c18d9ab3af4585870b92e4dbc5cac5a0dc77dd13df1a5905cea89fc720eb05b
          WORKDIR /app
          COPY --from=build /src/built/local ./built/local
          CMD ["node", "built/local/tsc.js", "--version"]
          DOCKERFILE
      - name: Measure workload
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/results/build-time.txt" bash -e -o pipefail -c 'docker build --no-cache --pull --progress=plain -f "$RUNNER_TEMP/Benchmark.Dockerfile" -t benchmark-typescript .' 2>&1 | tee "$RUNNER_TEMP/results/build.log"
      - name: Verify output
        run: |
          docker run --rm benchmark-typescript
      - name: Publish measurements
        if: always()
        env:
          PROVIDER: ${{ matrix.provider }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "## TypeScript Docker Build / $PROVIDER"
            echo "Outcome: $OUTCOME"
            echo 'One sample. Dependency downloads included; queue and setup excluded from workload timing.'
            echo '\`\`\`text'
            cat "$RUNNER_TEMP/results/build-time.txt" 2>/dev/null || true
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurements-${{ matrix.artifact }}
          path: ${{ runner.temp }}/results/
          retention-days: 30
