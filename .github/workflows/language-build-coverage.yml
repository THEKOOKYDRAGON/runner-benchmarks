          - {"language":"Go","project":"Caddy","repository":"caddyserver/caddy","ref":"551f793700fe1550845c824470b623fd1aa03d36","tool":"1.27.4","command":"go build -trimpath -o bin/caddy ./cmd/caddy","verify":"bin/caddy version","provider":"Blacksmith","runner":"blacksmith-32vcpu-ubuntu-2404","slug":"blacksmith"}
